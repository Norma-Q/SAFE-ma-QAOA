name: SAFE
# Reproduction environment for the SAFE ma-QAOA paper (arXiv:2605.23377).
#
#   conda env create -f environment.yml
#   conda activate SAFE
#
# torch is pinned to the ROCm build (torch.cuda targets the AMD GPU via HIP).
# padopauli (the LWPP surrogate engine) is a prebuilt wheel from the PADO-Pauli
# GitHub Releases and brings numpy/scipy/tqdm with it. pennylane + lightning
# provide the exact state-vector device (`lightning.amdgpu` on the GPU,
# `lightning.qubit` on CPU); matplotlib and pandas serve the figure/table scripts.
#
# CUDA hosts: swap the torch line for a CUDA build of torch 2.10-2.12 and
# pennylane-lightning-amdgpu for pennylane-lightning-gpu.
#
# If `qml.device("lightning.amdgpu", ...)` fails with an undefined
# `hsa_amd_memory_get_preferred_copy_engine` symbol, the plugin loaded the
# system ROCm runtime after torch's bundled one; fix once per env with
#   conda env config vars set LD_PRELOAD=/opt/rocm/lib/libhsa-runtime64.so.1 -n SAFE
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/rocm7.2
      - torch==2.11.0+rocm7.2
      - https://github.com/Norma-Q/PADO-Pauli/releases/download/v2.0.0/padopauli-2.0.0-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
      - pennylane==0.44.1
      - pennylane-lightning==0.45.0
      - pennylane-lightning-amdgpu==0.45.0
      - matplotlib==3.11.1
      - pandas==2.3.3
